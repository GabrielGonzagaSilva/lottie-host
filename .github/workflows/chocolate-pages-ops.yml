name: Deploy Chocolate com Pimenta (ops-monitor)

on:
  push:
    branches: ["ops-monitor"]
    paths:
      - "chocolate-com-pimenta/**"
      - ".github/workflows/chocolate-pages-ops.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "chocolate-pages-ops"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./chocolate-com-pimenta

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: chocolate-pages-temp
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
