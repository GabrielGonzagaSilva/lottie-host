<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Gabriel Ops — Monitor</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--card:#11141b;--line:#252b36;--text:#f4f6fb;--muted:#8e97a8;--ok:#5ee59a;--warn:#f2c94c;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:40px 18px}h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px}.sub{color:var(--muted);margin-bottom:24px}.summary,.grid{display:grid;gap:14px}.summary{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.label{color:var(--muted);font-size:12px}.value{font-size:22px;font-weight:800;margin-top:5px}.head{display:flex;justify-content:space-between;gap:12px}.status{font-size:11px;font-weight:800;text-transform:uppercase}.online{color:var(--ok)}.degraded{color:var(--warn)}.offline{color:var(--bad)}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.meta div{background:#0d1016;border:1px solid var(--line);border-radius:10px;padding:10px}.issues{font-size:12px;color:var(--muted);line-height:1.5}.issues b{color:var(--text)}a{color:inherit;text-decoration:none;overflow-wrap:anywhere}@media(max-width:760px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr}}
</style>
</head><body><main class="wrap"><h1>Gabriel Ops</h1><div class="sub" id="updated">Carregando monitor…</div><section class="summary"><div class="card"><div class="label">Status geral</div><div class="value" id="overall">—</div></div><div class="card"><div class="label">Online</div><div class="value" id="online">—</div></div><div class="card"><div class="label">Atenção</div><div class="value" id="degraded">—</div></div><div class="card"><div class="label">Offline</div><div class="value" id="offline">—</div></div></section><section class="grid" id="sites"></section></main>
<script>
const URL='https://raw.githubusercontent.com/GabrielGonzagaSilva/lottie-host/main/monitor/status.json';const labels={online:'Online',degraded:'Atenção',offline:'Offline'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(s){if(!s)return'—';return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium',timeZone:'America/Sao_Paulo'}).format(new Date(s))}function renderSite(s){const issues=(s.issues||[]);return `<article class="card"><div class="head"><div><h2 style="margin:0 0 6px;font-size:19px">${esc(s.name)}</h2><a class="label" href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.url)}</a></div><div class="status ${esc(s.status)}">${labels[s.status]||esc(s.status)}</div></div><div class="meta"><div><span class="label">HTTP</span><br><b>${esc(s.status_code??'—')}</b></div><div><span class="label">Latência</span><br><b>${Number.isFinite(s.latency_ms)?s.latency_ms+' ms':'—'}</b></div><div><span class="label">Checagem</span><br><b>${esc(fmt(s.checked_at))}</b></div></div><div class="issues">${issues.length?issues.map(i=>`<div><b>${esc(i.title)}</b>${i.detail?' — '+esc(i.detail):''}</div>`).join(''):'Nenhum incidente identificado.'}</div></article>`}async function load(){try{const r=await fetch(URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();overall.textContent=labels[d.overall]||d.overall;overall.className='value '+d.overall;online.textContent=d.counts?.online??0;degraded.textContent=d.counts?.degraded??0;offline.textContent=d.counts?.offline??0;updated.textContent='Dados gerados em '+fmt(d.generated_at);sites.innerHTML=(d.sites||[]).map(renderSite).join('')}catch(e){updated.textContent='Falha ao carregar o status';sites.innerHTML='<article class="card">O painel não conseguiu carregar o status atual.</article>'}}load();setInterval(load,60000)
</script></body></html>
