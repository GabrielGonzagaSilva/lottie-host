<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chocolate com Pimenta — MVP</title>
<style>
:root{--bg:#f2ece6;--paper:#fffdf9;--ink:#2b1813;--muted:#78665f;--line:#ddcec4;--accent:#7b2d1e;--soft:#f8f2ed;--ok:#286449;--bad:#9a3026;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#fff8ef,transparent 30%),var(--bg);min-height:100vh}button,input,select{font:inherit}.wrap{max-width:1180px;margin:auto;padding:24px}.narrow{max-width:720px}.panel{background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 32px rgba(60,35,25,.06)}h1,h2,h3,p{margin-top:0}.hero{margin-top:6vh;padding:38px}.hero h1{font-size:clamp(48px,8vw,92px);line-height:.9;letter-spacing:-.06em;margin:18px 0}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.13em;color:#a14a2f}.muted{color:var(--muted);line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;gap:14px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.btn{border:1px solid #ccb9ae;background:#fffaf6;color:var(--ink);border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.btn:hover{border-color:#9d6d59}.primary{background:var(--accent);border-color:var(--accent);color:white}.danger{color:var(--bad);border-color:#e5aaa4;background:#fff3f1}.btn:disabled{opacity:.42;cursor:not-allowed}label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px}input,select{width:100%;border:1px solid #d6c5bb;border-radius:10px;padding:11px;background:white;color:var(--ink)}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{border:1px solid #d6c5bb;background:#fff;border-radius:10px;padding:11px;font-weight:750}.seg .on{background:#2b1813;color:#fff}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:15px}.head h1{font-size:38px;letter-spacing:-.04em;margin-bottom:5px}.timer{background:#2b1813;color:#fff;border-radius:13px;padding:9px 14px;min-width:120px;text-align:center}.timer small{display:block;opacity:.65;font-size:9px;letter-spacing:.12em}.timer b{font-size:26px}.bar{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}.code b{font-size:25px;letter-spacing:.08em}.link{font-size:11px;word-break:break-all;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.team h3{margin-bottom:4px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.stat{background:var(--soft);border-radius:9px;padding:9px}.stat small{display:block;color:var(--muted);font-size:9px}.stat b{font-size:18px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--soft);border:1px solid #e6d8d0;border-radius:999px;padding:6px 9px;font-size:11px}.warn,.ok,.pause{border-radius:10px;padding:10px 12px;font-size:12px;margin-top:10px}.warn{background:#fff4d8;color:#674c18;border:1px solid #ecd58e}.ok{background:#edf7f0;color:var(--ok);border:1px solid #bfd9c7}.pause{background:#2b1813;color:white}.factory{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px}.inv{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.inv span{background:#2b1813;color:#fff;padding:6px 8px;border-radius:8px;font-size:10px}.queue{display:grid;gap:7px;max-height:310px;overflow:auto;margin:12px 0}.item{display:flex;gap:9px;align-items:center;border:1px solid #e2d4cb;border-radius:9px;padding:9px;background:white}.item input{width:auto}.freezer{min-height:160px;border:2px dashed #aabcc0;background:#f3fafb;border-radius:14px;padding:11px;margin:12px 0}.freezer .item{margin-bottom:7px}.big{font-size:38px;font-weight:900;color:var(--accent)}.timeline{display:grid;gap:6px;margin-top:12px}.event{border-top:1px solid #eee3dd;padding-top:7px;font-size:11px;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#2b1813;color:#fff;padding:11px 14px;border-radius:10px;z-index:10}.toast.bad{background:var(--bad)}@media(max-width:900px){.factory,.cards,.grid3{grid-template-columns:1fr}.bar{grid-template-columns:1fr}.head{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:14px}.hero{padding:24px}.hero h1{font-size:50px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast" hidden></div>
<script>
(()=>{'use strict';
const R={milk:{n:'Ao Leite',p:1,t:20,b:1,w:'Marrom claro',r:1,tag:0,tulle:0},dark:{n:'Amargo',p:1,t:20,b:1,w:'Marrom escuro',r:1,tag:0,tulle:0},white:{n:'Branco',p:1,t:20,b:1,w:'Bege',r:1,tag:0,tulle:0},pistachio:{n:'Pistache',p:3,t:45,b:2,w:'Verde',r:1,tag:1,tulle:0},berries:{n:'Frutas Vermelhas',p:5,t:50,b:2,w:'Vermelho',r:1,tag:1,tulle:0},caramel:{n:'Caramelo',p:7,t:60,b:2,w:'Amarelo',r:2,tag:1,tulle:1}};
const app=document.getElementById('app'),T=document.getElementById('toast');let screen=new URLSearchParams(location.search).get('join')?'join':'home',code=(new URLSearchParams(location.search).get('join')||'').toUpperCase(),pid='',selected=[];
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),key=c=>'choco-v4-'+c,load=c=>{try{return JSON.parse(localStorage.getItem(key(c)))}catch{return null}},save=s=>{localStorage.setItem(key(s.code),JSON.stringify(s));localStorage.setItem('choco-last-v4',s.code);return s},esc=x=>String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m)),fmt=x=>`${String(Math.floor(Math.max(0,x)/60)).padStart(2,'0')}:${String(Math.max(0,x)%60).padStart(2,'0')}`;
function toast(m,b=0){T.textContent=m;T.className='toast'+(b?' bad':'');T.hidden=false;setTimeout(()=>T.hidden=true,2200)}
function rem(s){if(s.paused!=null)return s.paused;if(!s.endsAt)return 0;return Math.max(0,Math.ceil((s.endsAt-Date.now())/1000))}
function phase(s){return({lobby:'Lobby',planning:'Planejamento',production:'Produção',results:'Encerrado'})[s.phase]}
function team(i){return{id:uid(),name:'Fábrica '+String.fromCharCode(65+i),players:[],inv:{base:70,ribbons:50,tags:20,tulle:20,wrap:{'Marrom claro':30,'Marrom escuro':30,'Bege':30,'Verde':20,'Vermelho':20,'Amarelo':20}},prepared:[],freezer:null,done:[],pen:[]}}
function make(mode,n,plan,prod){const c=Math.random().toString(36).slice(2,8).toUpperCase();return{code:c,mode,phase:'lobby',entries:true,plan:+plan*60,prod:+prod*60,endsAt:null,paused:null,cap:3,berries:5,inter:{talent:0,market:0,cap:0},teams:Array.from({length:+n},(_,i)=>team(i)),events:[{t:Date.now(),m:'Sessão criada.'}]}}
function mutate(c,fn){let s=load(c);if(!s)return toast('Sessão não encontrada.',1);try{s=fn(s)||s;save(s);render()}catch(e){toast(e.message,1)}}
function score(t,s){const c={milk:0,dark:0,white:0,pistachio:0,berries:0,caramel:0};t.done.forEach(x=>c[x.f]++);const ok=c.milk>=10&&c.dark>=10&&c.white>=10;return{c,ok,total:c.milk+c.dark+c.white+(ok?c.pistachio*3+c.berries*s.berries+c.caramel*7:0)}}
function settle(s){let ch=0;s.teams.forEach(t=>{if(t.freezer&&t.freezer.end<=Date.now()){t.done.push(...t.freezer.items.map(x=>({f:x.f,id:x.id})));t.freezer=null;ch=1}});if(ch)save(s);return s}
function timer(s){return `<div class="timer"><small>${s.paused!=null?'PAUSADO':phase(s).toUpperCase()}</small><b data-clock>${fmt(rem(s))}</b></div>`}
function home(){app.innerHTML=`<main class="wrap"><section class="panel hero"><span class="eyebrow">MVP DE TESTE</span><h1>Chocolate<br>com Pimenta</h1><p class="muted">Jogo cooperativo de produção inspirado em Overcooked, conduzido por um facilitador.</p><div class="row"><button class="btn primary" id="create">Criar sessão</button><button class="btn" id="join">Entrar em sessão</button></div></section><p class="warn"><b>Versão de validação:</b> sincroniza entre abas do mesmo navegador. Multiplayer entre computadores entra com Firebase.</p></main>`;create.onclick=()=>{screen='setup';render()};join.onclick=()=>{screen='join';code='';render()}}
function setup(){app.innerHTML=`<main class="wrap narrow"><button class="btn" id="back">← Início</button><section class="panel" style="margin-top:12px"><span class="eyebrow">FACILITADOR</span><h1>Criar sessão</h1><label>Versão</label><div class="seg"><button class="on" data-m="classic">Clássica</button><button data-m="pressure">Panela de Pressão</button></div><div class="grid grid3"><div><label>Equipes</label><input id="teams" type="number" min="2" max="4" value="2"></div><div><label>Planejamento (min)</label><input id="plan" type="number" min="1" value="10"></div><div><label>Produção (min)</label><input id="prod" type="number" min="1" value="15"></div></div><button class="btn primary" id="go" style="margin-top:18px;width:100%">Criar sessão</button></section></main>`;let mode='classic';back.onclick=()=>{screen='home';render()};document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b))});go.onclick=()=>{let s=make(mode,Math.max(2,Math.min(4,+teams.value)),plan.value,prod.value);save(s);code=s.code;screen='fac';render()}}
function teamCard(t,s){let sc=score(t,s);return `<article class="panel team"><h3>${esc(t.name)}</h3><p class="muted">${t.players.length} participante(s)</p><div class="stats"><div class="stat"><small>Pontos</small><b>${sc.total}</b></div><div class="stat"><small>Concluídas</small><b>${t.done.length}</b></div><div class="stat"><small>Preparadas</small><b>${t.prepared.length}</b></div><div class="stat"><small>Penalidades</small><b>${t.pen.length}</b></div></div><div class="chips">${Object.keys(R).map(k=>`<span class="chip">${R[k].n} <b>${sc.c[k]}</b></span>`).join('')}</div>${sc.ok?'<div class="ok">Meta 10+10+10 atingida.</div>':'<div class="warn">Premium bloqueado até 10+10+10.</div>'}</article>`}
function fac(){let s=settle(load(code));if(!s)return home();let url=location.href.split('?')[0]+'?join='+s.code;app.innerHTML=`<main class="wrap"><header class="head"><div><span class="eyebrow">FACILITADOR · ${s.mode==='pressure'?'PANELA DE PRESSÃO':'CLÁSSICA'}</span><h1>Chocolate com Pimenta</h1><p class="muted">${phase(s)} · ${s.entries?'entradas abertas':'entradas fechadas'}</p></div>${timer(s)}</header><section class="panel bar"><div class="code"><small>CÓDIGO</small><br><b>${s.code}</b></div><div class="link">${esc(url)}</div><div class="row"><button class="btn" id="copy">Copiar link</button><button class="btn" id="open">Abrir participante</button></div></section><section class="grid grid2" style="margin-top:14px"><article class="panel"><span class="eyebrow">CONTROLE</span><h2>Sessão</h2><div class="row"><button class="btn" id="planning">Planejamento</button><button class="btn primary" id="production">Produção</button>${s.endsAt?'<button class="btn" id="pause">Pausar</button>':''}${s.paused!=null?'<button class="btn" id="resume">Retomar</button>':''}<button class="btn" id="plus">+1 min</button><button class="btn danger" id="end">Encerrar</button><button class="btn" id="entries">${s.entries?'Fechar entradas':'Reabrir entradas'}</button></div><div class="chips" style="margin-top:14px"><span class="chip">Freezer <b>${s.cap}</b></span><span class="chip">Frutas Vermelhas <b>${s.berries} pts</b></span></div></article>${s.mode==='pressure'?`<article class="panel"><span class="eyebrow">INTERVENÇÕES</span><h2>Panela de Pressão</h2><div class="grid"><button class="btn" data-i="talent" ${s.inter.talent?'disabled':''}>Compartilhamento de talentos</button><button class="btn" data-i="market" ${s.inter.market?'disabled':''}>Mercado: Frutas Vermelhas 5 → 3</button><button class="btn" data-i="cap" ${s.inter.cap?'disabled':''}>Freezer 3 → 2</button></div></article>`:''}</section><section class="cards">${s.teams.map(t=>teamCard(t,s)).join('')}</section><section class="panel" style="margin-top:14px"><span class="eyebrow">HISTÓRICO</span><div class="timeline">${[...s.events].reverse().slice(0,10).map(e=>`<div class="event">${new Date(e.t).toLocaleTimeString('pt-BR')} · ${esc(e.m)}</div>`).join('')}</div></section></main>`;
copy.onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('Link copiado')}catch{toast('Copie o link manualmente',1)}};open.onclick=()=>window.open(url,'_blank');planning.onclick=()=>mutate(code,x=>{x.phase='planning';x.endsAt=Date.now()+x.plan*1000;x.paused=null;x.events.push({t:Date.now(),m:'Planejamento iniciado.'});return x});production.onclick=()=>mutate(code,x=>{x.phase='production';x.endsAt=Date.now()+x.prod*1000;x.paused=null;x.events.push({t:Date.now(),m:'Produção iniciada.'});return x});if(document.getElementById('pause'))pause.onclick=()=>mutate(code,x=>{x.paused=rem(x);x.endsAt=null;return x});if(document.getElementById('resume'))resume.onclick=()=>mutate(code,x=>{x.endsAt=Date.now()+x.paused*1000;x.paused=null;return x});plus.onclick=()=>mutate(code,x=>{if(x.endsAt)x.endsAt+=60000;else if(x.paused!=null)x.paused+=60;return x});end.onclick=()=>mutate(code,x=>{x.phase='results';x.endsAt=null;x.paused=null;return x});entries.onclick=()=>mutate(code,x=>{x.entries=!x.entries;return x});document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>mutate(code,x=>{let k=b.dataset.i;if(k==='market'){x.berries=3;x.inter.market=1;x.events.push({t:Date.now(),m:'Mercado atualizado: Frutas Vermelhas valem 3 pontos.'})}if(k==='cap'){x.cap=2;x.inter.cap=1;x.events.push({t:Date.now(),m:'Freezer reduzido para 2.'})}if(k==='talent'){let movers=x.teams.map(t=>t.players[0]||null);if(movers.filter(Boolean).length<2)throw Error('São necessários participantes em pelo menos duas equipes.');x.teams.forEach((t,i)=>{let p=movers[i];if(p){t.players=t.players.filter(z=>z.id!==p.id);x.teams[(i+1)%x.teams.length].players.push(p)}});x.inter.talent=1;x.events.push({t:Date.now(),m:'Compartilhamento de talentos aplicado.'})}return x}))}
function join(){let s=code.length===6?load(code):null;app.innerHTML=`<main class="wrap narrow"><button class="btn" id="back">← Início</button><section class="panel" style="margin-top:12px"><span class="eyebrow">ENTRAR</span><h1>Participante</h1><label>Código</label><input id="c" maxlength="6" value="${esc(code)}" placeholder="ABC123">${s?`<label>Nome</label><input id="name" placeholder="Seu nome"><label>Equipe</label><select id="team">${s.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button class="btn primary" id="enter" style="width:100%;margin-top:18px" ${s.entries?'':'disabled'}>${s.entries?'Entrar':'Entradas fechadas'}</button>`:'<p class="muted" style="margin-top:12px">Digite o código da sessão. A sessão precisa ter sido criada neste mesmo navegador nesta versão de teste.</p>'}</section></main>`;back.onclick=()=>{screen='home';render()};c.oninput=e=>{code=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);e.target.value=code;if(code.length===6)setTimeout(render,0)};if(s)enter.onclick=()=>{let n=name.value.trim();if(!n)return toast('Informe seu nome.',1);let t=s.teams.find(x=>x.id===team.value),p={id:uid(),name:n};t.players.push(p);save(s);pid=p.id;sessionStorage.setItem('choco-p-'+s.code,pid);screen='player';render()}}
function player(){let s=settle(load(code)),id=pid||sessionStorage.getItem('choco-p-'+code);if(!s||!id){screen='join';return render()}let t=s.teams.find(t=>t.players.some(p=>p.id===id)),p=t&&t.players.find(p=>p.id===id);if(!p){screen='join';return render()}let sc=score(t,s),active=s.phase==='production'&&s.paused==null&&rem(s)>0;selected=selected.filter(i=>t.prepared.some(x=>x.id===i));app.innerHTML=`<main class="wrap"><header class="head"><div><span class="eyebrow">${esc(t.name)} · ${esc(p.name)}</span><h1>Fábrica</h1><p class="muted">${phase(s)}</p></div>${timer(s)}</header>${s.paused!=null?'<div class="pause">Dinâmica pausada pelo facilitador.</div>':''}<div class="inv"><span>Barras ${t.inv.base}</span><span>Fitas ${t.inv.ribbons}</span><span>Tags ${t.inv.tags}</span><span>Tule ${t.inv.tulle}</span></div><section class="factory"><article class="panel"><span class="eyebrow">01</span><h2>Montagem</h2><label>Sabor</label><select id="flavor">${Object.keys(R).map(k=>`<option value="${k}">${R[k].n} · ${k==='berries'?s.berries:R[k].p} pts · ${R[k].t}s</option>`).join('')}</select><button class="btn primary" id="prepare" style="width:100%;margin-top:14px" ${active?'':'disabled'}>Preparar barra</button><p class="muted" style="font-size:11px;margin-top:10px">A receita correta é aplicada automaticamente nesta versão de validação.</p></article><article class="panel"><span class="eyebrow">02</span><h2>Fila do freezer</h2><div class="queue">${t.prepared.length?t.prepared.map(x=>`<label class="item"><input type="checkbox" data-id="${x.id}" ${selected.includes(x.id)?'checked':''}><span><b>${R[x.f].n}</b><br><small>${R[x.f].t}s</small></span></label>`).join(''):'<p class="muted">Nenhuma barra preparada.</p>'}</div><button class="btn" id="freeze" style="width:100%" ${active&&!t.freezer&&t.prepared.length?'':'disabled'}>Iniciar ciclo</button></article><article class="panel"><span class="eyebrow">03</span><h2>Freezer</h2><div class="freezer">${t.freezer?t.freezer.items.map(x=>`<div class="item"><span><b>${R[x.f].n}</b><br><small data-end="${t.freezer.end}">${Math.max(0,Math.ceil((t.freezer.end-Date.now())/1000))}s</small></span><button class="btn danger" data-pull="${x.id}" ${active?'':'disabled'}>Retirar antes</button></div>`).join(''):'<p class="muted">FREEZER LIVRE · capacidade '+s.cap+'</p>'}</div></article></section><section class="grid grid2" style="margin-top:14px"><article class="panel"><span class="eyebrow">PONTUAÇÃO</span><div class="big">${sc.total} pts</div><div class="chips">${Object.keys(R).map(k=>`<span class="chip">${R[k].n} <b>${sc.c[k]}</b></span>`).join('')}</div>${sc.ok?'<div class="ok">Meta 10+10+10 atingida.</div>':'<div class="warn">Premium não pontua até 10+10+10.</div>'}</article><article class="panel"><span class="eyebrow">QUALIDADE</span><h2>${t.pen.length} penalidade(s)</h2><div class="timeline">${[...t.pen].reverse().slice(0,8).map(x=>`<div class="event">${esc(x)}</div>`).join('')||'<p class="muted">Nenhuma penalidade.</p>'}</div></article></section></main>`;
prepare.onclick=()=>mutate(code,x=>{let tt=x.teams.find(z=>z.id===t.id),r=R[flavor.value];if(tt.inv.base<r.b||tt.inv.ribbons<r.r||tt.inv.tags<r.tag||tt.inv.tulle<r.tulle||tt.inv.wrap[r.w]<1)throw Error('Recursos insuficientes.');tt.inv.base-=r.b;tt.inv.ribbons-=r.r;tt.inv.tags-=r.tag;tt.inv.tulle-=r.tulle;tt.inv.wrap[r.w]--;tt.prepared.push({id:uid(),f:flavor.value});return x});document.querySelectorAll('[data-id]').forEach(i=>i.onchange=()=>{if(i.checked&&!selected.includes(i.dataset.id))selected.push(i.dataset.id);if(!i.checked)selected=selected.filter(z=>z!==i.dataset.id)});freeze.onclick=()=>mutate(code,x=>{let tt=x.teams.find(z=>z.id===t.id),items=tt.prepared.filter(z=>selected.includes(z.id));if(!items.length)throw Error('Selecione barras.');tt.prepared=tt.prepared.filter(z=>!selected.includes(z.id));selected=[];if(items.length>x.cap){tt.pen.push('Excesso de capacidade no freezer: '+items.length+' barras invalidadas.');return x}if(new Set(items.map(z=>R[z.f].t)).size>1){tt.pen.push('Tempos de resfriamento incompatíveis: barras invalidadas.');return x}tt.freezer={items,end:Date.now()+R[items[0].f].t*1000};return x});document.querySelectorAll('[data-pull]').forEach(b=>b.onclick=()=>mutate(code,x=>{let tt=x.teams.find(z=>z.id===t.id),it=tt.freezer.items.find(z=>z.id===b.dataset.pull);tt.freezer.items=tt.freezer.items.filter(z=>z.id!==it.id);if(!tt.freezer.items.length)tt.freezer=null;tt.pen.push('Retirada antecipada: '+R[it.f].n+' invalidado.');return x}))}
function render(){if(screen==='home')home();else if(screen==='setup')setup();else if(screen==='fac')fac();else if(screen==='join')join();else if(screen==='player')player()}
window.addEventListener('storage',e=>{if(code&&e.key===key(code))render()});setInterval(()=>{if((screen==='fac'||screen==='player')&&code){let s=load(code);if(s){let before=s.teams.some(t=>t.freezer&&t.freezer.end<=Date.now());if(before){settle(s);render()}let c=document.querySelector('[data-clock]');if(c)c.textContent=fmt(rem(load(code)));document.querySelectorAll('[data-end]').forEach(x=>x.textContent=Math.max(0,Math.ceil((+x.dataset.end-Date.now())/1000))+'s')}}},500);render();
})();
</script></body></html>
